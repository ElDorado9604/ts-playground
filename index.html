<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Lightweight TypeScript compiler playground. Full-page editor, mobile-friendly." />
  <title>TS Playground</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/typescript@5.6.3/lib/typescript.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/comment/comment.min.js"></script>
</head>
<body>
  <header>
    <h1>TS Playground</h1>
    <div class="toolbar">
      <button type="button" id="btn-undo" title="Undo (Ctrl+Z)">Undo</button>
      <button type="button" id="btn-redo" title="Redo (Ctrl+Y)">Redo</button>
      <button type="button" id="btn-run" class="primary" title="Compile &amp; Run (Ctrl+Enter)">Run</button>
      <button type="button" id="btn-output" title="Show output" disabled>Output</button>
    </div>
  </header>

  <main class="editor-only">
    <textarea id="editor" spellcheck="false"></textarea>
    <div id="diagnostics" class="diagnostics" aria-live="polite"></div>
  </main>

  <div id="output-backdrop" class="output-backdrop" aria-hidden="true"></div>
  <aside id="output-panel" class="output-panel" role="dialog" aria-label="Output" aria-hidden="true">
    <div class="output-header">
      <span>Output / Console</span>
      <div class="output-actions">
        <button type="button" id="btn-clear">Clear</button>
        <button type="button" id="btn-close-output" class="primary">Close</button>
      </div>
    </div>
    <pre id="output"></pre>
  </aside>

  <script src="app.js"></script>
</body>
</html>
